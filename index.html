    <style>

      *{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;margin:0}body{background:var(--bg-base);color:var(--text-primary);display:flex;flex-direction:row;font-family:Inter,-apple-system,sans-serif;gap:8px;overflow:hidden;padding:8px}.loading-overlay{align-items:center;background:var(--bg-base);display:flex;flex-direction:column;inset:0;justify-content:center;position:fixed;z-index:2000}.spinner{animation:spin 1s cubic-bezier(.55,.15,.45,.85) infinite;border:3px solid var(--border);border-radius:50%;border-top-color:var(--accent);height:36px;margin-bottom:20px;width:36px}@keyframes spin{to{transform:rotate(360deg)}}.sidebar{background:var(--bg-sidebar);border:1px solid var(--border-light);border-radius:12px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;min-width:260px;overflow:hidden;width:260px;z-index:100}.sidebar-header{align-items:center;display:flex;padding:20px 16px 12px}.sidebar-logo{height:28px;object-fit:contain;width:auto}.toolbar{border-bottom:1px solid var(--border-light);display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}.url-bar{position:relative;width:100%}.url-bar input,.search-container input,.form-group input{background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-family:Inter,sans-serif;outline:none;transition:all .2s;width:100%}.url-bar input{font-size:.85rem;padding:10px 32px 10px 14px}.url-bar input:focus,.search-container input:focus,.form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.15)}.spinner-icon{animation:spin 1s linear infinite;border:2px solid var(--border);border-radius:50%;border-top-color:var(--accent);height:14px;pointer-events:none;position:absolute;right:12px;top:50%;transform:translateY(-50%);width:14px}.nav-row{display:flex;gap:6px;justify-content:space-between}.nav-btn{align-items:center;background:var(--bg-surface);border:1px solid var(--border-light);border-radius:6px;color:var(--text-secondary);cursor:pointer;display:flex;flex:1;height:38px;justify-content:center;transition:all .2s}.nav-btn:hover{background:var(--bg-surface-hover);color:var(--text-primary)}.nav-btn.new-tab-btn{background:var(--accent-dim);border-color:transparent;color:var(--accent)}.nav-btn.new-tab-btn:hover{background:var(--accent);color:#fff}.tabs-container{display:flex;flex:1;flex-direction:column;gap:4px;overflow-y:auto;padding:12px 8px;scrollbar-width:none}.tabs-container::-webkit-scrollbar,.empty-state::-webkit-scrollbar{display:none}.tab{align-items:center;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--text-secondary);cursor:pointer;display:flex;font-size:.85rem;gap:10px;padding:10px 12px;transition:all .1s}.tab:hover:not(.active){background:var(--bg-surface-hover);color:var(--text-primary)}.tab.active{background:var(--bg-surface);border-color:var(--border-light);box-shadow:0 2px 5px rgba(0,0,0,.02);color:var(--accent)}.tab-title{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tab-icon-area{align-items:center;display:flex;flex-shrink:0;height:20px;justify-content:center;width:20px}.close-tab{align-items:center;border-radius:4px;color:var(--text-muted);display:flex;height:24px;justify-content:center;opacity:0;transition:all .2s;width:24px}.tab:hover .close-tab,.tab.active .close-tab{opacity:1}.close-tab:hover{background:rgba(0,0,0,.05);color:#ef4444}.content-area{background:#fff;border:1px solid var(--border-light);border-radius:12px;box-shadow:var(--shadow-lg);display:flex;flex:1;overflow:hidden;position:relative}#canvas-container{flex:1;height:100%;width:100%}#canvas-container iframe{border:0;display:block;height:100%;width:100%}.empty-state{align-items:center;background:var(--bg-base);display:flex;flex-direction:column;inset:0;overflow-y:auto;padding-top:12vh;position:absolute;scrollbar-width:none;z-index:10}.home-logo{height:100px;margin-bottom:40px;object-fit:contain;width:auto}.search-container{margin-bottom:50px;max-width:580px;padding:0 20px;width:100%}.search-container input{border-radius:12px;box-shadow:0 4px 6px rgba(0,0,0,.02);font-size:1rem;padding:16px 24px}.quick-apps-section,.recent-section{max-width:580px;padding:0 20px;width:100%}.section-header{display:flex;justify-content:flex-end;margin-bottom:12px}.edit-btn{background:transparent;border:0;color:var(--text-secondary);cursor:pointer;font-size:.85rem}.edit-btn:hover{color:var(--text-primary)}.quick-apps-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(85px,1fr));justify-items:center}.app-card{align-items:center;background:transparent;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;gap:10px;padding:12px 8px;position:relative;transition:all .2s;width:85px}.app-card:hover{background:var(--bg-surface);box-shadow:0 4px 6px rgba(0,0,0,.02);transform:translateY(-2px)}.app-icon{align-items:center;background:var(--bg-surface);border:1px solid var(--border-light);border-radius:12px;display:flex;height:60px;justify-content:center;padding:10px;width:60px}.app-icon img{height:100%;object-fit:contain;width:100%}.app-name{color:var(--text-primary);font-size:.75rem;overflow:hidden;text-align:center;text-overflow:ellipsis;white-space:nowrap;width:100%}.card-actions{display:flex;gap:4px;opacity:0;position:absolute;right:0;top:0;transition:opacity .2s}.app-card:hover .card-actions{opacity:1}.action-btn{align-items:center;background:var(--bg-surface);border:1px solid var(--border);border-radius:50%;color:var(--text-primary);cursor:pointer;display:flex;font-size:11px;height:22px;justify-content:center;width:22px}.action-btn:hover{background:var(--accent);border-color:var(--accent);color:white}.add-card .app-icon{background:transparent;border:1px dashed var(--border);color:var(--text-secondary);font-size:24px}.aboutblank-btn{align-items:center;background:var(--bg-surface);border:1px solid var(--border-light);border-radius:12px;box-shadow:0 4px 6px rgba(0,0,0,.02);color:var(--text-primary);cursor:pointer;display:flex;font-size:.9rem;gap:8px;margin-top:40px;padding:12px 24px;transition:all .2s}.aboutblank-btn:hover{background:var(--bg-surface-hover);transform:translateY(-1px)}.recent-section{margin-top:40px;padding-bottom:40px}.recent-section h3{color:var(--text-secondary);font-size:.9rem;font-weight:600;letter-spacing:.5px;margin-bottom:12px;text-transform:uppercase}.recent-list{display:flex;flex-direction:column;gap:6px}.recent-item{align-items:center;border:1px solid transparent;border-radius:8px;cursor:pointer;display:flex;gap:16px;padding:12px;transition:background .2s}.recent-item:hover{background:var(--bg-surface);border-color:var(--border-light)}.recent-favicon{border-radius:4px;height:22px;width:22px}.recent-info{display:flex;flex:1;flex-direction:column;gap:4px;overflow:hidden}.recent-title,.recent-url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.recent-title{color:var(--text-primary);font-size:.85rem;font-weight:500}.recent-url{color:var(--text-muted);font-size:.75rem}.recent-remove{align-items:center;border-radius:6px;color:var(--text-muted);display:flex;height:24px;justify-content:center;opacity:0;transition:all .2s;width:24px}.recent-item:hover .recent-remove{opacity:1}.recent-remove:hover{background:rgba(239,68,68,.1);color:#ef4444}.modal-overlay{align-items:center;backdrop-filter:blur(4px);background:rgba(0,0,0,.3);display:flex;inset:0;justify-content:center;position:fixed;z-index:2000}.modal{background:var(--bg-surface);border:1px solid var(--border-light);border-radius:12px;box-shadow:var(--shadow-lg);max-width:400px;padding:24px;width:100%}.modal h4{color:var(--text-primary);font-size:1.1rem;font-weight:600;margin-bottom:20px}.form-group{margin-bottom:16px}.form-group label{color:var(--text-secondary);display:block;font-size:.85rem;margin-bottom:8px}.form-group input{background:var(--bg-base);border-radius:6px;padding:10px 14px}.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}.btn{border:0;border-radius:6px;cursor:pointer;font-size:.85rem;font-weight:500;padding:10px 18px;transition:all .2s}.btn-cancel{background:transparent;color:var(--text-secondary)}.btn-save{background:var(--accent);color:white}.btn-save:hover{background:var(--accent-hover)}
    </style>

  <body x-data="mathApp()">
    <div x-show="!ready" class="loading-overlay"><template x-if="!initError"><div style="display:flex;flex-direction:column;align-items:center"><div class="spinner"></div><p style="font-size:.9rem;color:var(--text-secondary);font-weight:500" x-text="loadingStatus"></p></div></template><template x-if="initError"><div style="display:flex;flex-direction:column;align-items:center;gap:16px;max-width:360px;text-align:center;padding:20px"><div style="font-size:2rem">⚠️</div><p style="color:var(--text-primary);font-size:.9rem" x-text="initError"></p><button @click="forceReady()" style="padding:10px 24px;background:var(--accent);border:none;border-radius:6px;color:white;font-size:.9rem;cursor:pointer;font-weight:500">Continue Anyway</button><button @click="location.reload()" style="padding:10px 24px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-secondary);font-size:.9rem;cursor:pointer">Reload Page</button></div></template></div>
    <div class="sidebar" x-show="ready" style="display:none"><div class="sidebar-header"><img src="https://cdn.jsdelivr.net/gh/Sea-Math/OFFICIAL-SU-REPO@main/logo.png" alt="Logo" class="sidebar-logo" /></div><div class="toolbar"><div class="url-bar"><form @submit.prevent="navigate(); $event.target.querySelector('input').blur()" style="margin:0"><input type="text" x-model="currentUrlInput" placeholder="Search or enter URL..." /></form><div class="spinner-icon" x-show="isLoading"></div></div><div class="nav-row"><button class="nav-btn" @click="goBack()" title="Back">←</button><button class="nav-btn" @click="goForward()" title="Forward">→</button><button class="nav-btn" @click="reloadTab()" title="Reload">↻</button><button class="nav-btn new-tab-btn" @click="addTab()" title="New Tab">+</button></div></div><div class="tabs-container"><template x-for="tab in tabs" :key="tab.id"><div class="tab" :class="{active:activeTabId===tab.id}" @click="activateTab(tab.id)"><div class="tab-icon-area"><template x-if="tab.loading"><div class="spinner" style="width:18px;height:18px;border-width:2px;margin:0"></div></template><template x-if="!tab.loading"><img :src="tab.favicon || 'https://cdn.jsdelivr.net/gh/Sea-Math/OFFICIAL-SU-REPO@main/mathpunch.jpeg'" style="width:20px;height:20px;border-radius:4px" /></template></div><span class="tab-title" x-text="tab.title || 'New Tab'"></span><span class="close-tab" @click.stop="closeTab(tab.id)">×</span></div></template></div></div>
    <div class="content-area" x-show="ready" style="display:none"><div id="canvas-container"></div><div class="empty-state" x-show="showNewTabUI"><img src="https://cdn.jsdelivr.net/gh/Sea-Math/OFFICIAL-SU-REPO@main/logo.png" alt="Logo" class="home-logo" /><div class="search-container"><form @submit.prevent="navigateFromHome(); $event.target.querySelector('input').blur()"><input type="text" x-model="homeSearchInput" placeholder="Search the web or enter an address..." autofocus /></form></div><div class="quick-apps-section"><div class="section-header"><button class="edit-btn" @click="isEditingBookmarks=!isEditingBookmarks" x-text="isEditingBookmarks ? 'Done Editing' : 'Edit Shortcuts'"></button></div><div class="quick-apps-grid"><template x-for="bm in bookmarks" :key="bm.id"><div class="app-card" @click="!isEditingBookmarks && (bm.url.startsWith('/') ? window.location.href = bm.url : navigateBookmark(bm.url))"><div class="app-icon"><img :src="bm.icon || `https://www.google.com/s2/favicons?domain=${bm.url}&sz=128`" :alt="bm.name" /></div><span class="app-name" x-text="bm.name"></span><div class="card-actions" x-show="isEditingBookmarks"><div class="action-btn" @click.stop="editBookmark(bm)">✎</div><div class="action-btn" @click.stop="removeBookmark(bm.id)">×</div></div></div></template><div class="app-card add-card" x-show="isEditingBookmarks" @click="openAddModal()"><div class="app-icon">+</div><span class="app-name">Add Shortcut</span></div></div></div><button class="aboutblank-btn" @click="openInAboutBlank()">Open in about:blank</button><div class="recent-section" x-show="recentSites.length > 0"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h3>Recent Sites</h3><button class="edit-btn" style="padding:0" @click="clearRecent()">Clear History</button></div><div class="recent-list"><template x-for="(site,index) in recentSites.slice(0,5)" :key="index"><div class="recent-item" @click="navigateBookmark(site.url)"><img class="recent-favicon" :src="`https://www.google.com/s2/favicons?domain=${site.url}&sz=64`" /><div class="recent-info"><div class="recent-title" x-text="site.title || site.url"></div><div class="recent-url" x-text="site.url"></div></div><div class="recent-remove" @click.stop="removeRecent(index)">×</div></div></template></div></div></div></div>
    <div class="modal-overlay" x-show="showBookmarkModal" x-transition.opacity style="display:none"><div class="modal" @click.away="showBookmarkModal=false"><h4 x-text="bookmarkForm.id ? 'Edit Shortcut' : 'Add Shortcut'"></h4><div class="form-group"><label>Name</label><input type="text" x-model="bookmarkForm.name" placeholder="e.g. YouTube" /></div><div class="form-group"><label>URL</label><input type="text" x-model="bookmarkForm.url" placeholder="https://..." /></div><div class="form-group"><label>Icon URL (Optional)</label><input type="text" x-model="bookmarkForm.icon" placeholder="https://.../favicon.png" /></div><div class="modal-footer"><button class="btn btn-cancel" @click="showBookmarkModal=false">Cancel</button><button class="btn btn-save" @click="saveBookmark()">Save</button></div></div></div>
    <script>
      function mathApp(){return{canvas:null,ready:false,error:null,initError:null,loadingStatus:'Starting browser...',tabs:[],activeTabId:null,currentUrlInput:'',homeSearchInput:'',recentSites:[],bookmarks:[],isEditingBookmarks:false,showBookmarkModal:false,bookmarkForm:{id:null,name:'',url:'',icon:''},get activeTab(){return this.tabs.find(t=>t.id===this.activeTabId)},get isLoading(){return this.activeTab?this.activeTab.loading:false},get showNewTabUI(){if(!this.activeTab)return true;return !this.activeTab.url||this.activeTab.url==='about:blank'||this.activeTab.url.includes('/newtab.html')},forceReady(){this.ready=true},async init(){const timeout=setTimeout(()=>{if(!this.ready)this.initError='Initialization timed out. The proxy files may be missing or blocked.'},8000);const defaults=[{id:2,name:'GitHub',url:'https://github.com'},{id:3,name:'CrazyGames',url:'https://crazygames.com'},{id:6,name:'Granite',url:'https://seabean.hollands.id.au/granite.html'},{id:7,name:'Shuttlemath',url:'https://shuttlemath.com'},{id:8,name:'nowgg',url:'https://nowgg.fun'}];const savedBookmarks=localStorage.getItem('seabean_bookmarks');if(savedBookmarks){try{this.bookmarks=JSON.parse(savedBookmarks).filter(bm=>![1,4,5].includes(bm.id)).map(bm=>{if(bm.icon&&bm.icon.includes('google.com/s2/favicons?domain=about:blank'))bm.icon='';const defaultBm=defaults.find(d=>d.id===bm.id);return defaultBm?{...bm,...defaultBm}:bm});this.saveToStorage()}catch{this.bookmarks=defaults;this.saveToStorage()}}else{this.bookmarks=defaults;this.saveToStorage()}try{const savedRecent=localStorage.getItem('seabean_recent_sites');if(savedRecent)this.recentSites=JSON.parse(savedRecent)}catch{this.recentSites=[]}let SuCanvas;try{this.loadingStatus='Loading proxy engine...';const canvasModule=await import('https://cdn.jsdelivr.net/gh/Sea-Math/OFFICIAL-SU-REPO@main/su-canvas.js');SuCanvas=canvasModule.SuCanvas||window.SuCanvas;if(!SuCanvas)throw new Error('SuCanvas export missing')}catch(e){clearTimeout(timeout);this.initError='Failed to load proxy files from jsDelivr: '+e.message;return}try{this.loadingStatus='Starting proxy...';this.canvas=new SuCanvas('canvas-container')}catch(e){clearTimeout(timeout);this.initError='Failed to initialize SuCanvas: '+e.message;return}this.canvas.on(SuCanvas.EVENTS.SURFACE_CREATED,()=>this.refreshTabs());this.canvas.on(SuCanvas.EVENTS.SURFACE_CLOSED,()=>this.refreshTabs());this.canvas.on(SuCanvas.EVENTS.SURFACE_CHANGE,s=>{this.activeTabId=s?s.id:null;if(s)this.updateFromSurface(s);else this.currentUrlInput=''});this.canvas.on(SuCanvas.EVENTS.URL_CHANGE,data=>{this.currentUrlInput=(data.decoded.includes('/newtab.html')||data.decoded==='about:blank')?'':data.decoded;this.refreshTabs()});this.canvas.on(SuCanvas.EVENTS.TITLE_CHANGE,()=>{this.refreshTabs();const tab=this.activeTab;if(tab&&tab.url&&tab.url!=='about:blank'&&!tab.url.includes('/newtab.html')&&tab.title&&tab.title!=='New Tab')this.addToRecent({url:tab.url,title:tab.title})});this.canvas.on(SuCanvas.EVENTS.FAVICON_CHANGE,()=>this.refreshTabs());this.canvas.on(SuCanvas.EVENTS.LOADING_START,()=>this.refreshTabs());this.canvas.on(SuCanvas.EVENTS.LOADING_STOP,()=>this.refreshTabs());this.canvas.on(SuCanvas.EVENTS.READY,()=>{clearTimeout(timeout);this.initError=null;this.ready=true});this.canvas.on(SuCanvas.EVENTS.ERROR,e=>console.error('SuCanvas error:',e));try{this.addTab()}catch(e){clearTimeout(timeout);this.initError='Failed to create initial tab: '+e.message}} ,updateFromSurface(surface){if(surface.client){const decoded=surface.client.decode(surface.client._lastUrl||'');this.currentUrlInput=decoded==='about:blank'?'':decoded}},refreshTabs(){this.tabs=Array.from(this.canvas.surfaces.values()).map(s=>{const client=s.client;const rawUrl=client?client._lastUrl||'':'';const decoded=client?client.decode(rawUrl):'';return{id:s.id,title:s.title,favicon:s.favicon,loading:client?client.getState().loading:false,url:decoded}});if(this.activeTab)document.title=this.activeTab.title&&this.activeTab.title!=='New Tab'?`${this.activeTab.title} - Sea Bean`:'Sea Bean'},saveToStorage(){localStorage.setItem('seabean_bookmarks',JSON.stringify(this.bookmarks))},addTab(){const id=this.canvas.createSurface();this.canvas.switchSurface(id)},closeTab(id){this.canvas.closeSurface(id)},activateTab(id){if(id!==this.activeTabId)this.canvas.switchSurface(id)},navigate(){if(!this.currentUrlInput)return;this.canvas.navigate(this.currentUrlInput)},navigateFromHome(){if(!this.homeSearchInput)return;this.canvas.navigate(this.homeSearchInput);this.homeSearchInput=''},navigateBookmark(url){this.currentUrlInput=url;this.navigate()},reloadTab(){this.canvas.reload()},goBack(){this.canvas.goBack()},goForward(){this.canvas.goForward()},addToRecent(site){this.recentSites=this.recentSites.filter(s=>s.url!==site.url);this.recentSites.unshift(site);if(this.recentSites.length>10)this.recentSites=this.recentSites.slice(0,10);localStorage.setItem('seabean_recent_sites',JSON.stringify(this.recentSites))},removeRecent(index){this.recentSites.splice(index,1);localStorage.setItem('seabean_recent_sites',JSON.stringify(this.recentSites))},clearRecent(){this.recentSites=[];localStorage.removeItem('seabean_recent_sites')},openInAboutBlank(){const win=window.open('about:blank','_blank');if(!win){alert('Popup blocked! Please allow popups for this site.');return}win.document.title='Sea Bean';const iframe=win.document.createElement('iframe');iframe.style='position:fixed;top:0;left:0;width:100%;height:100%;border:none;';iframe.src=window.location.href;win.document.body.style='margin:0;padding:0;overflow:hidden;';win.document.body.appendChild(iframe)},openAddModal(){this.bookmarkForm={id:null,name:'',url:'',icon:''};this.showBookmarkModal=true},editBookmark(bm){this.bookmarkForm={...bm};this.showBookmarkModal=true},removeBookmark(id){this.bookmarks=this.bookmarks.filter(b=>b.id!==id);this.saveToStorage()},saveBookmark(){if(!this.bookmarkForm.name||!this.bookmarkForm.url)return;if(this.bookmarkForm.id){const idx=this.bookmarks.findIndex(b=>b.id===this.bookmarkForm.id);this.bookmarks[idx]={...this.bookmarkForm}}else this.bookmarks.push({...this.bookmarkForm,id:Date.now()});this.saveToStorage();this.showBookmarkModal=false}}}
    </script>
